# Builds the units in parallel and publishes them as the beta-<branch>
# prerelease. Promote a beta with create-latest-release.yaml.
#
# A device branch (DEVICE_BRANCHES below, e.g. "rg351p") publishes instead to
# a release tagged with the branch name itself, so an installer can always
# fetch the newest build of that device from one tag. The release it replaces
# is kept, retagged <branch>-YYYYMMDD (the day it was built), by
# .github/scripts/archive-release.sh. The tag has the same name as the branch:
# in local clones say refs/heads/<branch> (or refs/tags/<branch>), and the
# GitHub API reaches the release as releases/tags/<branch>.

name: build-all

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the images, e.g. v1.1.3"
        required: true
      units:
        description: "Comma-separated units (blank = every unit in .github/units.txt; on a device branch such as rg351p, just that unit)"
        required: false
        default: ""
      replace:
        description: "Swap only these units into the current beta of the same version"
        type: boolean
        default: false

permissions:
  contents: write

# Device branch (rg351p) only: its runs would race the archive and create steps
# over the one release tag, so they run one at a time. GitHub keeps at most one
# pending run per group: a run waiting behind another is replaced (cancelled) by
# any newer dispatch, so dispatch one build at a time. Every other branch gets a unique
# group per run, i.e. no concurrency limit, exactly as upstream. env is not
# available here, so the branch name is written literally.
concurrency:
  group: ${{ github.ref_name == 'rg351p' && 'build-all-rg351p' || format('build-all-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  # Branches published to a release tagged with the branch name (see above).
  DEVICE_BRANCHES: "rg351p"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      units: ${{ steps.units.outputs.units }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPLACE: ${{ inputs.replace }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like v1.2.3"; exit 1; }
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$VERSION is already released"; exit 1
          fi
          # A device branch's version is what Firmware Update compares and what
          # names the .dmupd, so a new build must not reuse one: not the current
          # <branch> release's, nor an archived <branch>-YYYYMMDD one's. Rebuilding
          # units of the current version is what "replace" is for.
          case " $DEVICE_BRANCHES " in *" $GITHUB_REF_NAME "*)
            if [ "$REPLACE" != true ]; then
              used="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                | jq -rs --arg b "$GITHUB_REF_NAME" --arg v "Version: ${VERSION}" 'add // [] | .[]
                    | select(.tag_name == $b or (.tag_name | startswith($b + "-")))
                    | select((.body // "") | gsub("\r"; "") | split("\n") | index([$v]) != null)
                    | .tag_name')" \
                || { echo "::error::could not list the releases to check ${VERSION}"; exit 1; }
              if [ -n "$used" ]; then
                echo "::error::${VERSION} was already built on ${GITHUB_REF_NAME} (${used//$'\n'/ }); pick a new version, or tick replace to rebuild units of the current one"
                exit 1
              fi
            fi
            ;;
          esac

      - name: Pick the units
        id: units
        env:
          UNITS: ${{ inputs.units }}
        run: |
          # A device branch builds its own unit unless told otherwise, not every unit.
          if [ -z "$UNITS" ]; then
            case " $DEVICE_BRANCHES " in *" $GITHUB_REF_NAME "*) UNITS="$GITHUB_REF_NAME" ;; esac
          fi
          # Other branches: every unit except the device-branch ones, so their
          # default builds are unchanged by a device branch's unit being listed.
          if [ -z "$UNITS" ]; then
            UNITS="$(grep -v '^\s*$' .github/units.txt | grep -vx -F -f <(tr ' ' '\n' <<<"$DEVICE_BRANCHES") | paste -sd,)"
          fi
          json="$(jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))' <<<"$UNITS")"
          for u in $(jq -r '.[]' <<<"$json"); do
            grep -qx "$u" .github/units.txt || { echo "::error::$u is not in .github/units.txt"; exit 1; }
          done
          echo "units=$json" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
    uses: ./.github/workflows/build-image.yaml
    with:
      unit: ${{ matrix.unit }}
      version: ${{ inputs.version }}

  publish:
    needs: [plan, build]
    # A failed unit just has no artifact; the beta gets whatever built.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Collect the images
        uses: actions/download-artifact@v4
        with:
          pattern: dArkMoss-*
          merge-multiple: true

      # The V10 and the RG351P share one card with spruce: add their install steps
      # to the notes. While a unit's spruce files are not in a spruce release, a
      # fork can carry them on a branch named after the unit ("v10", "rg351p") of
      # <owner>/spruceOS; when that branch exists its files are attached as
      # spruce-<UNIT>-overlay.zip. Without it a unit gets its notes only.
      - name: Check out (release notes, archive script)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Single-card notes and spruce overlays
        if: ${{ contains(needs.plan.outputs.units, '"v10"') || contains(needs.plan.outputs.units, '"rg351p"') }}
        env:
          OVERLAY_REPO: ${{ github.repository_owner }}/spruceOS
          # The unit's files are what its branch adds over spruce itself, so the
          # base is spruceUI's Development, not the fork's own copy of it: a fork
          # rarely keeps that branch current, and a stale one put hundreds of
          # unrelated, older spruce files in the overlay (256 files, 44 MB, for
          # the RG351P's 23).
          SPRUCE_UPSTREAM: spruceUI/spruceOS
          UNITS: ${{ needs.plan.outputs.units }}
        run: |
          for unit in v10 rg351p; do
            jq -e --arg u "$unit" 'index($u) != null' <<<"$UNITS" >/dev/null || continue
            UNIT_UC="${unit^^}"
            cp "src/.github/${unit}-release-notes.md" "${unit}-notes.md"
            if ! git ls-remote --exit-code --heads "https://github.com/${OVERLAY_REPO}" "$unit" >/dev/null 2>&1; then
              echo "No ${unit} branch on ${OVERLAY_REPO}: no ${UNIT_UC} overlay attached"
              continue
            fi
            rm -rf spruce-src
            GIT_LFS_SKIP_SMUDGE=1 git clone -q --filter=blob:none --no-checkout -b "$unit" "https://github.com/${OVERLAY_REPO}" spruce-src
            (
              cd spruce-src
              git fetch -q "https://github.com/${SPRUCE_UPSTREAM}" Development
              base="$(git merge-base FETCH_HEAD HEAD)"
              # RG351P: card files only, not the branch's CI (.github), its root
              # docs (CONTRIBUTING.md, README.md) or Saves/, which holds the
              # user's live spruce settings. spruce/flags stays: a spruce without
              # the unit has no first_boot_<UNIT>.lock, and firstboot needs it.
              only=()
              if [ "$unit" = rg351p ]; then
                only=( -- . ':(exclude).github' ':(exclude,glob)*.md' ':(exclude)Saves' )
              fi
              git diff --name-only --diff-filter=ACMR "$base" HEAD "${only[@]}" > "../overlay-files-${unit}.txt"
              [ -s "../overlay-files-${unit}.txt" ] || { echo "::error::no ${UNIT_UC} files on ${OVERLAY_REPO} ${unit}"; exit 1; }
              # RG351P: the overlay replaces shared spruce files with whole copies
              # from this base, so the notes name the base and those files.
              if [ "$unit" = rg351p ]; then
                shared="$({ grep -v -i "$unit" "../overlay-files-${unit}.txt" || true; } | sed 's/.*/`&`/' | paste -sd, - | sed 's/,/, /g')"
                {
                  printf '\n**Overlay base:** built against spruceUI/spruceOS Development `%s` (%s). Use a spruce nightly built from that commit or shortly after it, one that does not change the shared files listed below. A nightly'\''s `commits_nightly.txt` (inside its .7z) names its Development commit on the `Last commit:` line.\n' \
                    "$(git rev-parse --short "$base")" "$(git log -1 --format=%cs "$base")"
                  [ -z "$shared" ] || printf '\nShared spruce files it replaces: %s\n' "$shared"
                } > "../overlay-base-${unit}.txt"
              fi
              tr '\n' '\0' < "../overlay-files-${unit}.txt" | xargs -0 git archive --format=zip -o "../spruce-${UNIT_UC}-overlay.zip" HEAD --
            )
            rm -rf spruce-src
            unzip -l "spruce-${UNIT_UC}-overlay.zip" | tail -1
            cat "src/.github/${unit}-overlay-note.md" >> "${unit}-notes.md"
            if [ -f "overlay-base-${unit}.txt" ]; then cat "overlay-base-${unit}.txt" >> "${unit}-notes.md"; fi
          done

      - name: Checksums
        run: |
          shopt -s nullglob
          imgs=( *.img.7z* )
          [ ${#imgs[@]} -gt 0 ] || { echo "::error::no unit produced an image"; exit 1; }
          extra=( spruce-*-overlay.zip )
          sha256sum *.img.7z* *.dmupd "${extra[@]}" > SHA256SUMS
          ls -lh *.img.7z* *.dmupd SHA256SUMS

      - name: Publish the beta
        env:
          # RELEASE_TOKEN (recommended repository secret for device branches): a
          # fine-grained token with Contents and Workflows write here, for
          # archive-release.sh. The run token may be refused (403) when a release
          # is moved to a new tag on a commit with workflow changes the default
          # branch lacks; the publish then fails after the build, and only this
          # job needs a re-run once the secret is set.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ inputs.version }}
          UNITS: ${{ needs.plan.outputs.units }}
          REPLACE: ${{ inputs.replace }}
        run: |
          device=false
          case " $DEVICE_BRANCHES " in *" $GITHUB_REF_NAME "*) device=true ;; esac
          if [ "$device" = true ]; then TAG="$GITHUB_REF_NAME"; else TAG="beta-$GITHUB_REF_NAME"; fi
          if [ "$REPLACE" = true ]; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md \
              || { echo "::error::no $TAG to update"; exit 1; }
            grep -qx "Version: ${VERSION}" notes.md || { echo "::error::$TAG is not ${VERSION}"; exit 1; }
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -O old.sums
            for u in $(jq -r '.[]' <<<"$UNITS"); do
              prefix="dArkMoss_${u^^}_"
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
                | grep "^${prefix}" | while read -r a; do
                  gh release delete-asset "$TAG" "$a" --repo "$GITHUB_REPOSITORY" --yes
                done
              grep -v "  ${prefix}" old.sums > old.tmp || true
              mv old.tmp old.sums
            done
            cat old.sums SHA256SUMS | sort -k2 > merged.sums
            mv merged.sums SHA256SUMS
            shopt -s nullglob
            extra=( spruce-*-overlay.zip )
            gh release upload "$TAG" *.img.7z* *.dmupd "${extra[@]}" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            echo "Rebuilt $(jq -r 'join(" ")' <<<"$UNITS") at ${GITHUB_SHA}" >> notes.md
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            exit 0
          fi
          # Asset names carry the date and version, so start from an empty release.
          # A device branch keeps the release it replaces, under <branch>-YYYYMMDD.
          if [ "$device" = true ]; then
            src/.github/scripts/archive-release.sh "$TAG" "$GITHUB_REF_NAME"
          else
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          fi
          cat > notes.md <<EOF
          Beta build from \`${GITHUB_REF_NAME}\`. Not for general use.

          Version: ${VERSION}
          Commit: ${GITHUB_SHA}
          Units: $(jq -r 'join(" ")' <<<"$UNITS")
          EOF
          [ -f v10-notes.md ] && cat v10-notes.md >> notes.md
          [ -f rg351p-notes.md ] && cat rg351p-notes.md >> notes.md
          shopt -s nullglob
          extra=( spruce-*-overlay.zip )
          gh release create "$TAG" *.img.7z* *.dmupd "${extra[@]}" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Beta Build (${GITHUB_REF_NAME}) ${VERSION}" \
            --notes-file notes.md \
            --prerelease \
            --latest=false
          # The device tag must name this build's commit: an old tag left behind
          # would silently give the new release a stale commit.
          if [ "$device" = true ]; then
            got="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" -q .object.sha)" || got=""
            if [ "$got" != "$GITHUB_SHA" ]; then
              echo "::error::release ${TAG} points at ${got:-no tag}, not ${GITHUB_SHA}"
              exit 1
            fi
          fi
