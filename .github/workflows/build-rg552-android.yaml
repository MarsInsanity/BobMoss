name: build-rg552-android

# The RG552's Android companion app (android/rg552-bootswitch): puts the
# dArkMoss boot loader back on the TF1 card and reboots into it. Built with the
# runner's preinstalled Android SDK, no Gradle. Optionally attached to a
# release by tag.

on:
  # build-rg552.yaml calls this and publishes the APK with the image.
  workflow_call:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach RG552BootSwitch.apk to (blank = artifact only)"
        required: false
        type: string
        default: ""
  push:
    paths:
      - "android/rg552-bootswitch/**"
      - "scripts/rg552/rg552-bootswitch"
      - ".github/workflows/build-rg552-android.yaml"

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Signed with the key in the RG552_APK_KEYSTORE secret (base64 of a
      # keystore; RG552_APK_KEYSTORE_PASS its password, RG552_APK_KEY_ALIAS its
      # alias, default rg552), so a new build installs over the previous one.
      # Without it, build.sh signs with a throwaway key and every install needs
      # the old app uninstalled first. The version code is minutes since the
      # epoch: it only goes up, whether built here or by build-rg552.yaml.
      - name: Build the APK
        env:
          APK_KEYSTORE_B64: ${{ secrets.RG552_APK_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.RG552_APK_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.RG552_APK_KEY_ALIAS || 'rg552' }}
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          if [ -n "$APK_KEYSTORE_B64" ]; then
            printf '%s' "$APK_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rg552.keystore"
            export KEYSTORE="$RUNNER_TEMP/rg552.keystore"
          else
            echo "::warning::No RG552_APK_KEYSTORE secret: signed with a throwaway key, so it will not install over an earlier build"
            unset KEYSTORE_PASS KEY_ALIAS
          fi
          export VERSION_CODE="$(( $(date -u +%s) / 60 ))"
          export VERSION_NAME="1.$(date -u +%Y%m%d.%H%M)"
          android/rg552-bootswitch/build.sh "$PWD/RG552BootSwitch.apk"
          rm -f "$RUNNER_TEMP/rg552.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: RG552BootSwitch
          path: RG552BootSwitch.apk

      - name: Attach to the release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" RG552BootSwitch.apk --repo "$GITHUB_REPOSITORY" --clobber
