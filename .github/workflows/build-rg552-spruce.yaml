# Packages spruce for the Anbernic RG552 - the MarsInsanity/spruceOS fork's
# rg552 branch - as a spruce .7z for the TF2 card, and publishes it as the
# release tagged "RG552-spruce".
#
# The packaging follows spruce's own branch builds (spruceUI/spruceOS
# .github/workflows/create-branch-alpha-release.yml): version marker, the split
# large files put back together, the extra PyUI themes, Licenses archived, the
# same 7z settings and exclusions. Those publish to spruceUI's nightlies repo,
# so this fork packages here instead, next to the RG552 base images.
#
# Starts when .github/rg552-spruce-ref changes on the rg552 branch. That file
# holds the full spruceOS commit to package. As with the "RG552" release, the
# previous "RG552-spruce" release is first moved to
# "rg552-spruce-<date built>" (-2, -3 ... for a second build that day).

name: build-rg552-spruce

on:
  push:
    branches: [rg552]
    paths: [".github/rg552-spruce-ref"]

permissions:
  contents: write

concurrency:
  group: build-rg552-spruce
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: bobmoss
          sparse-checkout: .github

      - name: Which spruceOS commit
        id: ref
        run: |
          REF="$(tr -d '[:space:]' < bobmoss/.github/rg552-spruce-ref)"
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.github/rg552-spruce-ref must hold a full 40-character spruceOS commit, got '$REF'"; exit 1; }
          echo "sha=$REF" >> "$GITHUB_OUTPUT"

      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - uses: actions/checkout@v4
        with:
          repository: MarsInsanity/spruceOS
          ref: ${{ steps.ref.outputs.sha }}
          path: spruce
          fetch-depth: 1
          lfs: false

      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Version
        id: version
        working-directory: spruce
        run: |
          BASE="$(tr -d '[:space:]' < spruce/spruce)"
          VERSION="${BASE}-RG552-$(date -u +%Y%m%d)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # spruce's version marker: an empty file named after the version.
          : > "${VERSION}"

      - name: Recombine large files
        working-directory: spruce
        run: |
          if ls spruce/flip/miyoo355_rootfs_32.img_part* 1>/dev/null 2>&1; then
            rm -f spruce/flip/miyoo355_rootfs_32.img
            cat spruce/flip/miyoo355_rootfs_32.img_part* > spruce/flip/miyoo355_rootfs_32.img
            rm -f spruce/flip/miyoo355_rootfs_32.img_part*
          fi

          if ls spruce/flip/muOS-pixie-reduced.sqsh-part* 1>/dev/null 2>&1; then
            rm -f spruce/flip/muOS-pixie-reduced.sqsh
            cat spruce/flip/muOS-pixie-reduced.sqsh-part* > spruce/flip/muOS-pixie-reduced.sqsh
            rm -f spruce/flip/muOS-pixie-reduced.sqsh-part*
          fi

          if ls RetroArch/.retroarch/cores64/scummvm_libretro.so.part* 1>/dev/null 2>&1; then
            cat RetroArch/.retroarch/cores64/scummvm_libretro.so.part* > RetroArch/.retroarch/cores64/scummvm_libretro.so
            rm -f RetroArch/.retroarch/cores64/scummvm_libretro.so.part*
          fi

      - name: Pull selected PyUI Themes
        working-directory: spruce
        run: |
          mkdir -p Themes
          RELEASE_URL="https://github.com/spruceUI/PyUI-Themes/releases/download/1"

          wget -q --no-check-certificate -O "Themes/ALEKFULL_NX_ES.7z" "${RELEASE_URL}/ALEKFULL_NX_ES.7z" || true
          wget -q --no-check-certificate -O "Themes/ART_BOOK_OUTLINE.7z" "${RELEASE_URL}/ART_BOOK_OUTLINE.7z" || true
          wget -q --no-check-certificate -O "Themes/ART_BOOK_NEXT.7z" "${RELEASE_URL}/ART_BOOK_NEXT.7z" || true
          wget -q --no-check-certificate -O "Themes/Avocado.7z" "${RELEASE_URL}/Avocado.7z" || true
          wget -q --no-check-certificate -O "Themes/Cosy by KyleBing.7z" "${RELEASE_URL}/Cosy_by_KyleBing.7z" || true
          wget -q --no-check-certificate -O "Themes/Grape.7z" "${RELEASE_URL}/Grape.7z" || true
          wget -q --no-check-certificate -O "Themes/GREEN.7z" "${RELEASE_URL}/GREEN.7z" || true
          wget -q --no-check-certificate -O "Themes/HeyDW's Blue.7z" "${RELEASE_URL}/HeyDWs_Blue.7z" || true
          wget -q --no-check-certificate -O "Themes/M.7z" "${RELEASE_URL}/M.7z" || true
          wget -q --no-check-certificate -O "Themes/MINIMAL.7z" "${RELEASE_URL}/MINIMAL.7z" || true
          wget -q --no-check-certificate -O "Themes/MinUInspired (logos).7z" "${RELEASE_URL}/MinUInspired_(logos).7z" || true
          wget -q --no-check-certificate -O "Themes/OTB.7z" "${RELEASE_URL}/OTB.7z" || true
          wget -q --no-check-certificate -O "Themes/Pico-8.7z" "${RELEASE_URL}/Pico-8.7z" || true
          wget -q --no-check-certificate -O "Themes/SLABS.7z" "${RELEASE_URL}/SLABS.7z" || true
          wget -q --no-check-certificate -O "Themes/SPRUCE (simple).7z" "${RELEASE_URL}/SPRUCE_(simple).7z" || true

          find Themes -name "*.7z" -empty -delete
          ls -lh Themes

      - name: Archive Licenses folder
        working-directory: spruce
        run: |
          7z a -t7z -mx=9 Licenses.7z Licenses/
          rm -rf Licenses/

      - name: Create 7z archive
        working-directory: spruce
        env:
          ARCHIVE: spruceV${{ steps.version.outputs.version }}.7z
        run: |
          7z a -t7z -m0=lzma2:d=16m -mx=7 -ms=off -mf- "$ARCHIVE" * .tmp_update \
            -xr!.git \
            -xr!.github \
            -x!.gitignore \
            -x!.gitattributes \
            -x!create_spruce_release.bat \
            -x!create_spruce_release.sh \
            -x!To-Do.txt
          mkdir -p "$GITHUB_WORKSPACE/out"
          mv "$ARCHIVE" "$GITHUB_WORKSPACE/out/"
          ls -l "$GITHUB_WORKSPACE/out"

      # Release assets are capped at 2 GiB: a larger archive becomes 7z
      # volumes (.7z.001, .002 ... - plain byte parts that 7-Zip opens).
      - name: Split if needed and checksum
        working-directory: out
        env:
          ARCHIVE: spruceV${{ steps.version.outputs.version }}.7z
        run: |
          if [ "$(stat -c %s "$ARCHIVE")" -gt 2000000000 ]; then
            split -b 1990M -d -a 3 --numeric-suffixes=1 "$ARCHIVE" "$ARCHIVE."
            rm -f "$ARCHIVE"
          fi
          sha256sum spruceV* > SHA256SUMS
          ls -lh

      # The RELEASE_TOKEN secret, as for the RG552 release: the workflow token
      # cannot create a tag on an rg552 commit (its workflow files differ from
      # the default branch's).
      - name: Check the release token
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
          REPO: ${{ github.repository }}
        run: |
          [ "$HAS_RELEASE_TOKEN" = true ] || { echo "::error::RG552 releases need the RELEASE_TOKEN secret (fine-grained token, Contents + Workflows read/write on this repo)"; exit 1; }
          if ! out="$(gh api "repos/$REPO" --jq .full_name 2>&1)"; then
            echo "::error::GitHub rejected RELEASE_TOKEN: $out. Save a new fine-grained token (Contents + Workflows read/write on this repo) as the RELEASE_TOKEN secret, then re-run this job."
            exit 1
          fi

      - name: Move the previous RG552-spruce build to rg552-spruce-<date built>
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view RG552-spruce --repo "$REPO" >/dev/null 2>&1; then
            built="$(gh release view RG552-spruce --repo "$REPO" --json createdAt -q .createdAt | cut -c1-10)"
            ref="$(gh api "repos/$REPO/git/ref/tags/RG552-spruce")"
            sha="$(jq -r .object.sha <<<"$ref")"
            if [ "$(jq -r .object.type <<<"$ref")" = tag ]; then
              sha="$(gh api "repos/$REPO/git/tags/$sha" -q .object.sha)"
            fi
            new="rg552-spruce-${built}"; n=2
            while gh api "repos/$REPO/git/ref/tags/$new" >/dev/null 2>&1; do
              new="rg552-spruce-${built}-${n}"; n=$((n + 1))
            done
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$new" -f sha="$sha" >/dev/null
            gh release edit RG552-spruce --repo "$REPO" --tag "$new" \
              --title "spruceOS for the RG552 (built ${built})" --latest=false
            echo "Previous RG552-spruce build is now $new"
          fi
          if gh api "repos/$REPO/git/ref/tags/RG552-spruce" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$REPO/git/refs/tags/RG552-spruce"
          fi

      - name: Publish as RG552-spruce
        working-directory: out
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          SPRUCE_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          cat > notes.md <<EOF
          spruceOS for the Anbernic RG552, packaged from
          [MarsInsanity/spruceOS@${SPRUCE_SHA:0:9}](https://github.com/MarsInsanity/spruceOS/commit/${SPRUCE_SHA}) (branch \`rg552\`).

          Version: ${VERSION}
          Built: $(date -u +%Y-%m-%d)

          Extract \`spruceV${VERSION}.7z\` (or its \`.7z.001\` with 7-Zip) to the root
          of the TF2 card. The dArkMoss base for TF1 is the release tagged \`RG552\`.

          The tag \`RG552-spruce\` always holds the newest package; older ones are
          kept as \`rg552-spruce-<date built>\`.
          EOF
          gh release create RG552-spruce spruceV* SHA256SUMS \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "spruceOS for the RG552 ${VERSION}" \
            --notes-file notes.md \
            --latest=false
