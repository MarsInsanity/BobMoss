# G80CA (R36S clone, unit r36sclone): build and publish under the "g80ca" tag.
#
# Releases in this repository serve several handhelds, so the G80CA's are told
# apart by tag alone (an installer can pick or skip them by it):
#   g80ca               the newest G80CA build, always exactly one release
#   g80ca-YYYY-MM-DD    each older G80CA build, by the day it was built
# Every other release is left alone.
#
# To build, put the new version in .github/g80ca-version on the g80ca branch
# and push. This runs upstream's build-all for r36sclone (or waits for one
# already running), then promotes the beta-g80ca prerelease build-all
# publishes. When the version is already built, it only re-tags: promotes an
# existing beta-g80ca and files away any old G80CA release still under another
# tag. A push is the trigger because GitHub only dispatches workflows found on
# the default branch, which stays a mirror of upstream; this file is the
# clone's own, and build-all.yaml stays upstream's.

name: g80ca release

on:
  push:
    branches: [g80ca]
    paths:
      - ".github/g80ca-version"
      - ".github/workflows/g80ca-release.yaml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: g80ca-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/g80ca'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Build r36sclone with build-all
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < .github/g80ca-version)"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::.github/g80ca-version must hold a version like v1.2.3"; exit 1; }
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          # A build already running on the branch: wait for it rather than start a second.
          running="$(gh run list --workflow build-all.yaml --branch g80ca --json databaseId,status \
                       --jq 'map(select(.status != "completed")) | first | .databaseId // empty')"
          if [ -n "$running" ]; then
            echo "waiting for build-all ${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${running}"
            gh run watch "$running" --exit-status --interval 120 > /dev/null
            exit 0
          fi
          for t in $(gh release list --limit 200 --json tagName -q '.[].tagName' | grep -E '^(g80ca|beta-g80ca)' || true); do
            if gh release view "$t" --json body -q .body | grep -qx "Version: ${VERSION}"; then
              echo "${VERSION} is already built (release ${t}): only re-tagging"; exit 0
            fi
          done
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run build-all.yaml --ref refs/heads/g80ca -f version="${VERSION}" -f units=r36sclone
          id=""
          for _ in $(seq 60); do
            sleep 10
            id="$(gh run list --workflow build-all.yaml --branch g80ca --event workflow_dispatch \
                    --json databaseId,createdAt \
                    --jq "map(select(.createdAt >= \"${start}\")) | last | .databaseId // empty")"
            [ -n "$id" ] && break
          done
          [ -n "$id" ] || { echo "::error::the build-all run did not start"; exit 1; }
          echo "build-all: ${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${id}"
          gh run watch "$id" --exit-status --interval 120 > /dev/null

      - name: Tag the G80CA releases
        env:
          # RELEASE_TOKEN (repository secret): a fine-grained token with Contents
          # and Workflows write. The run token is refused (403) when it puts a
          # tag on a commit whose workflow files differ from the default
          # branch's, as every g80ca commit's do (this file).
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          tag_exists() { gh api "repos/${GH_REPO}/git/ref/tags/$1" > /dev/null 2>&1; }
          release_exists() { gh release view "$1" > /dev/null 2>&1; }
          version_of() { gh release view "$1" --json body -q .body | sed -n 's/^Version: //p' | head -1; }
          built_on() { gh release view "$1" --json createdAt -q .createdAt | cut -c1-10; }
          # Move release $1 to tag $2 (created on the release's own commit) and
          # drop the old tag, so each build sits under exactly one tag.
          retag() {
            local from="$1" to="$2" title="$3"
            gh release edit "$from" --tag "$to" --title "$title"
            if tag_exists "$from"; then gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${from}"; fi
            echo "release ${from} -> ${to}"
          }
          archive() {
            local from="$1" day name n=2
            day="$(built_on "$from")"
            name="g80ca-${day}"
            while release_exists "$name" || tag_exists "$name"; do name="g80ca-${day}-${n}"; n=$((n + 1)); done
            retag "$from" "$name" "G80CA (R36S clone) $(version_of "$from"), built ${day}"
          }

          # Older G80CA builds under any other tag (the branch's earlier names).
          gh release list --limit 200 --json tagName -q '.[].tagName' | while read -r t; do
            case "$t" in g80ca|g80ca-*|beta-g80ca) continue ;; esac
            gh release view "$t" --json assets -q '.assets[].name' | grep -q '^dArkMoss_R36SCLONE_' || continue
            archive "$t"
          done

          if release_exists beta-g80ca; then
            if release_exists g80ca; then archive g80ca; fi
            # A tag left without its release would take the new one's place.
            if tag_exists g80ca; then gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/g80ca"; fi
            retag beta-g80ca g80ca "G80CA (R36S clone) $(version_of beta-g80ca), built $(built_on beta-g80ca)"
          elif ! release_exists g80ca; then
            echo "::error::no beta-g80ca or g80ca release: build-all published nothing"; exit 1
          fi
          echo "G80CA releases now:"
          gh release list --limit 200 --json tagName,name -q '.[] | select(.tagName | startswith("g80ca")) | "\(.tagName)  \(.name)"'
